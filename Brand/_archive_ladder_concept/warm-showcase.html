<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Николай Балашов — тёплые варианты знака</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --umber:#3A2A1D; --umber-deep:#2A1E14;
    --cream:#EFE3C8; --ivory:#F8EFD9; --sand:#E3D2A8;
    --gold:#FFC94D; --honey:#C9861A; --terracotta:#C1662E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:#211B18;font-family:'Space Mono',monospace;padding:26px 18px 60px}
  h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(24px,6.5vw,36px);text-transform:uppercase;margin-bottom:6px}
  .sub{font-family:'Instrument Serif';font-style:italic;font-size:17px;color:#3A302A;margin-bottom:28px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .cell{border-radius:18px;padding:22px 10px 16px;text-align:center}
  .cell svg{width:56px;height:56px}
  .label{font-size:10px;margin-top:10px;letter-spacing:.03em;line-height:1.4;opacity:.85}
  .bg-umber{background:linear-gradient(155deg,var(--umber),var(--umber-deep));color:var(--ivory)}
  .bg-cream{background:var(--ivory);color:#5A4A3A;box-shadow:0 1px 0 rgba(0,0,0,.08) inset}
  .bg-gold{background:linear-gradient(155deg,var(--gold),var(--honey));color:#3A2A1D}
  .bg-sand{background:var(--sand);color:#5A4A3A}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<h1>Тёплые варианты</h1>
<p class="sub">Тот же знак — палитра сдвинута из афишных цветов в тёплые: слоновая кость, золото, мёд, терракота.</p>

<div class="grid">

  <div class="cell bg-umber">
    <svg viewBox="0 0 120 120"><rect x="26" y="18" width="14" height="84" rx="7" fill="#F8EFD9"/><rect x="80" y="18" width="14" height="84" rx="7" fill="#F8EFD9"/><rect x="18" y="53" width="84" height="14" rx="7" fill="#FFC94D"/></svg>
    <p class="label">слоновая кость + золото<br>на умбре</p>
  </div>

  <div class="cell bg-cream">
    <svg viewBox="0 0 120 120"><rect x="26" y="18" width="14" height="84" rx="7" fill="#F0B33D"/><rect x="80" y="18" width="14" height="84" rx="7" fill="#F0B33D"/><rect x="18" y="53" width="84" height="14" rx="7" fill="#C9861A"/></svg>
    <p class="label">золото + мёд<br>на слоновой кости</p>
  </div>

  <div class="cell bg-cream">
    <svg viewBox="0 0 120 120"><rect x="26" y="18" width="14" height="84" rx="7" fill="#C1662E"/><rect x="80" y="18" width="14" height="84" rx="7" fill="#C1662E"/><rect x="18" y="53" width="84" height="14" rx="7" fill="#F8EFD9"/></svg>
    <p class="label">терракота + кость<br>на слоновой кости</p>
  </div>

  <div class="cell bg-gold">
    <svg viewBox="0 0 120 120"><rect x="26" y="18" width="14" height="84" rx="7" fill="#F8EFD9"/><rect x="80" y="18" width="14" height="84" rx="7" fill="#F8EFD9"/><rect x="18" y="53" width="84" height="14" rx="7" fill="#C1662E"/></svg>
    <p class="label">кость + терракота<br>на золоте</p>
  </div>

  <div class="cell bg-sand">
    <svg viewBox="0 0 120 120"><rect x="26" y="18" width="14" height="84" rx="7" fill="#C9861A"/><rect x="80" y="18" width="14" height="84" rx="7" fill="#C9861A"/><rect x="18" y="53" width="84" height="14" rx="7" fill="#F8EFD9"/></svg>
    <p class="label">мёд + кость<br>на песочном</p>
  </div>

  <div class="cell bg-umber">
    <svg viewBox="0 0 120 120"><rect x="26" y="18" width="14" height="84" rx="7" fill="#FFDD8A"/><rect x="80" y="18" width="14" height="84" rx="7" fill="#FFDD8A"/><rect x="18" y="53" width="84" height="14" rx="7" fill="#C9861A"/></svg>
    <p class="label">тональное золото<br>на умбре</p>
  </div>

</div>

</body>
</html>
